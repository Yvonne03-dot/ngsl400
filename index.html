<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGSL 1-400 · 全词汇复习</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f4f7fc;
            color: #1e293b;
            padding: 24px 16px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: white;
            padding: 16px 24px;
            border-radius: 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.02);
            margin-bottom: 28px;
        }
        .logo { font-weight: 600; font-size: 1.3rem; letter-spacing: -0.3px; color: #0f3b5e; }
        .logo span { color: #3b82f6; }
        .word-count-badge {
            font-size: 0.9rem;
            color: #475569;
            background: #f1f5f9;
            padding: 4px 16px;
            border-radius: 40px;
        }
        .action-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .btn {
            background: white;
            border: 1px solid #d1d9e6;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn:hover { background: #f1f5f9; border-color: #94a3b8; }
        .btn-primary { background: #1e293b; border-color: #1e293b; color: white; }
        .btn-primary:hover { background: #0f172a; }
        .btn-outline-blue { border-color: #b9d0f0; color: #1e4a7a; }
        .btn-outline-blue:hover { background: #e6eff9; }
        .btn-danger { color: #b91c1c; border-color: #fecaca; }
        .btn-danger:hover { background: #fee2e2; }
        .btn-cloud { border-color: #6b7280; color: #374151; }
        .btn-cloud:hover { background: #e5e7eb; }

        .progress-badge {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            background: white;
            padding: 12px 24px;
            border-radius: 60px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            font-size: 0.85rem;
            margin-bottom: 24px;
            align-items: center;
        }
        .badge-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 20px; display: inline-block; }
        .dot.review { background: #94a3b8; }
        .dot.learning { background: #f59e0b; }
        .dot.mastered { background: #22c55e; }

        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 32px;
        }
        @media (max-width: 780px) { .card-grid { grid-template-columns: 1fr; } }

        .card {
            background: white;
            border-radius: 28px;
            padding: 20px 20px 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.02);
            border: 1px solid #eef2f6;
        }
        .card-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #e2e8f0;
            padding-bottom: 10px;
        }
        .card-title small { font-weight: 400; font-size: 0.75rem; color: #64748b; }

        .vocab-card {
            background: #fafcff;
            border-radius: 20px;
            padding: 18px;
            border: 1px solid #e9edf2;
        }
        .word-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; }
        .word-en { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.3px; }
        .word-ipa { font-size: 1rem; color: #475569; font-weight: 400; margin-left: 8px; }
        .word-pos { color: #dc2626; font-weight: 600; margin-left: 8px; font-size: 0.95rem; }
        .word-meaning { font-size: 1.1rem; margin-top: 6px; color: #0f172a; }
        .word-example {
            background: #f1f5f9;
            padding: 10px 14px;
            border-radius: 16px;
            margin-top: 12px;
            font-size: 0.9rem;
            color: #1e293b;
            border-left: 4px solid #3b82f6;
        }
        .word-example-cn { color: #475569; font-size: 0.85rem; margin-top: 4px; }
        .audio-row { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
        .audio-btn {
            background: #f1f4f9;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.1s;
        }
        .audio-btn:hover { background: #e2e8f0; }

        .quiz-area { margin-top: 10px; }
        .quiz-option {
            display: block;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 8px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: 0.1s;
            font-weight: 500;
        }
        .quiz-option:hover { background: #f1f5f9; border-color: #b9d0f0; }
        .quiz-option.correct { background: #dcfce7; border-color: #22c55e; }
        .quiz-option.wrong { background: #fee2e2; border-color: #ef4444; }
        .quiz-input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 60px;
            border: 1px solid #d1d9e6;
            font-size: 1rem;
            margin: 12px 0 8px;
            outline: none;
        }
        .quiz-input:focus { outline: 2px solid #3b82f6; border-color: transparent; }
        .helper-text { font-size: 0.8rem; color: #64748b; margin: 6px 0 12px; }
        .quiz-feedback { font-weight: 500; margin: 6px 0; }

        .wordlist-section {
            background: white;
            border-radius: 28px;
            padding: 20px 24px;
            border: 1px solid #eef2f6;
            margin-top: 20px;
            overflow-x: auto;
        }
        .wordlist-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-top: 10px;
        }
        .wordlist-table th { text-align: left; padding: 8px 6px; background: #f1f5f9; border-radius: 12px; }
        .wordlist-table td { padding: 8px 6px; border-bottom: 1px solid #eef2f6; }
        .wordlist-table .status-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .status-review { background: #e2e8f0; color: #475569; }
        .status-learning { background: #fef3c7; color: #b45309; }
        .status-mastered { background: #dcfce7; color: #15803d; }

        .lock-info {
            background: #f1f5f9;
            padding: 12px 18px;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #475569;
            margin: 12px 0 4px;
            text-align: center;
        }
        .footer-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .save-badge {
            font-size: 0.75rem;
            color: #22c55e;
            background: #dcfce7;
            padding: 2px 12px;
            border-radius: 40px;
            display: inline-block;
        }
        .cloud-status {
            font-size: 0.8rem;
            color: #64748b;
            padding: 4px 12px;
            border-radius: 40px;
            background: #f1f5f9;
        }
        .cloud-status.success { background: #dcfce7; color: #15803d; }
        .cloud-status.error { background: #fee2e2; color: #b91c1c; }
        .cloud-status.loading { background: #fef3c7; color: #b45309; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="header">
        <div class="logo">📘 <span>NGSL</span> · 1-400</div>
        <span class="word-count-badge" id="totalWordCount">总词数: 0</span>
        <div class="action-group">
            <button class="btn btn-outline-blue" id="shuffleBtn">🔀 打乱</button>
            <button class="btn btn-danger" id="resetAllBtn">⟲ 重置全部进度</button>
            <button class="btn btn-cloud" id="saveCloudBtn">☁️ 保存到云端</button>
            <button class="btn btn-cloud" id="loadCloudBtn">☁️ 从云端加载</button>
            <span id="cloudStatus" class="cloud-status">☁️ 就绪</span>
        </div>
    </div>

    <div class="progress-badge">
        <span class="badge-item"><span class="dot review"></span> 待复习 <strong id="reviewCount">0</strong></span>
        <span class="badge-item"><span class="dot learning"></span> 学习中 <strong id="learningCount">0</strong></span>
        <span class="badge-item"><span class="dot mastered"></span> 已掌握 <strong id="masteredCount">0</strong></span>
    </div>

    <div class="card-grid">
        <div class="card">
            <div class="card-title">📖 单词卡 <small id="cardIndex">1 / 0</small></div>
            <div id="vocabCardContainer">
                <div class="vocab-card" id="vocabCard">
                    <div class="word-header">
                        <span>
                            <span class="word-en" id="cardWord">—</span>
                            <span class="word-ipa" id="cardIpa">/—/</span>
                            <span class="word-pos" id="cardPos">—</span>
                        </span>
                    </div>
                    <div class="word-meaning" id="cardMeaning">—</div>
                    <div class="word-example" id="cardExample">📌 例句加载中</div>
                    <div class="word-example-cn" id="cardExampleCn"></div>
                    <div class="audio-row">
                        <button class="audio-btn" id="playWordAudio">🔊 生词</button>
                        <button class="audio-btn" id="playExampleAudio">🔊 例句</button>
                    </div>
                </div>
            </div>
            <div style="display:flex; justify-content:space-between; margin-top:16px;">
                <button class="btn" id="prevCardBtn">◀ 上一张</button>
                <button class="btn" id="nextCardBtn">下一张 ▶</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">✏️ 练习 <small id="partLabel">第二部分 · 选中文</small></div>
            <div id="quizContainer">
                <div id="quizContent">
                    <div style="text-align:center;color:#64748b;padding:20px 0;">加载词库…</div>
                </div>
            </div>
            <div class="lock-info" id="lockInfo">🔒 完成当前部分所有题目后解锁下一部分</div>
            <div class="footer-actions">
                <button class="btn" id="resetQuizBtn">↻ 重练当前</button>
            </div>
        </div>
    </div>

    <div class="wordlist-section">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
            <span style="font-weight:600;">📋 完整词表</span>
            <span style="font-size:0.75rem; color:#64748b;" id="wordlistMeta"></span>
        </div>
        <table class="wordlist-table" id="wordlistTable">
            <thead><tr><th>生词</th><th>音标</th><th>词性</th><th>释义</th><th>进度</th></tr></thead>
            <tbody id="wordlistBody"></tbody>
        </table>
    </div>
</div>

<script>
    // ================================================================
    // NGSL 1-400 完整词库（按Rank升序）- 共400个词
    // ================================================================
    const RAW_WORDS = [
  { "word": "the", "ipa": "/ði/", "pos": "det", "meaning": "used to refer to something already mentioned", "example": "I read the book.", "exampleCn": "我读了那本书。" },
  { "word": "be", "ipa": "/bi/", "pos": "verb", "meaning": "To exist; to be alive; used to give information about someone or something", "example": "I want to be a doctor.", "exampleCn": "我想成为一名医生。" },
  { "word": "and", "ipa": "/ænd/", "pos": "conj", "meaning": "used to refer to two or more things", "example": "I like apples and bananas.", "exampleCn": "我喜欢苹果和香蕉。" },
  { "word": "of", "ipa": "/ɑv/", "pos": "prep", "meaning": "belonging to or connected with something", "example": "The color of the sky is blue.", "exampleCn": "天空的颜色是蓝色的。" },

  { "word": "it", "ipa": "/ɪt/", "pos": "pron", "meaning": "a thing that has been previously mentioned", "example": "I like the book. It is interesting.", "exampleCn": "我喜欢这本书。它很有趣。" },
  { "word": "you", "ipa": "/ju/", "pos": "pron", "meaning": "person someone is speaking or writing to", "example": "You are my friend.", "exampleCn": "你是我的朋友。" },
  { "word": "he", "ipa": "/hi/", "pos": "pron", "meaning": "object form of a male person you are talking about", "example": "He is a teacher.", "exampleCn": "他是一名老师。" },
  { "word": "for", "ipa": "/fɔr/", "pos": "prep", "meaning": "used to show the purpose, or need of something", "example": "This is for you.", "exampleCn": "这是给你的。" },
  { "word": "they", "ipa": "/ðeɪ/", "pos": "pron", "meaning": "used to refer to two or more people, animals, or things", "example": "They are playing outside.", "exampleCn": "他们在外面玩。" },
  { "word": "not", "ipa": "/nɒt/", "pos": "adv", "meaning": "word indicating the negative of verbs, adjectives, etc.", "example": "I am not happy.", "exampleCn": "我不开心。" },
  { "word": "that", "ipa": "/ðæt/", "pos": "pron", "meaning": "used to show which person or thing we are talking about", "example": "I know that man.", "exampleCn": "我认识那个人。" },
  { "word": "we", "ipa": "/wi/", "pos": "pron", "meaning": "used to refer to the speaker and other people together", "example": "We are going home.", "exampleCn": "我们要回家了。" },
  { "word": "on", "ipa": "/ɑn/", "pos": "prep", "meaning": "located on the surface of something (e.g., a table or wall)", "example": "The cup is on the table.", "exampleCn": "杯子在桌子上。" },
  { "word": "with", "ipa": "/wɪð/", "pos": "prep", "meaning": "used to express that people or things are together", "example": "I go with you.", "exampleCn": "我和你一起去。" },
  { "word": "this", "ipa": "/ðɪs/", "pos": "pron", "meaning": "person, thing, or idea near you", "example": "This is my house.", "exampleCn": "这是我的房子。" },
  { "word": "I", "ipa": "/aɪ/", "pos": "pron", "meaning": "the person who is speaking or writing", "example": "I am happy.", "exampleCn": "我很高兴。" },
  { "word": "do", "ipa": "/du/", "pos": "verb", "meaning": "to act; to perform actions", "example": "I do my homework.", "exampleCn": "我做我的家庭作业。" },

  { "word": "but", "ipa": "/bʌt/", "pos": "conj", "meaning": "used before you say something different, opposite", "example": "I am tired, but happy.", "exampleCn": "我很累，但是很开心。" },
  { "word": "from", "ipa": "/frɑm/", "pos": "prep", "meaning": "starting at a particular place, time, or level", "example": "I am from China.", "exampleCn": "我来自中国。" },

  { "word": "get", "ipa": "/gɛt/", "pos": "verb", "meaning": "to obtain, receive, or be given something", "example": "I get a gift.", "exampleCn": "我得到一份礼物。" },
  { "word": "who", "ipa": "/hu/", "pos": "pron", "meaning": "what or which person or people, to ask about, talking about", "example": "Who is that?", "exampleCn": "那是谁？" },

  { "word": "when", "ipa": "/wɛn/", "pos": "noun", "meaning": "word you use to ask about the time or day", "example": "When will you come?", "exampleCn": "你什么时候来？" },
  { "word": "think", "ipa": "/θɪŋk/", "pos": "verb", "meaning": "to have an idea, opinion, or belief about something", "example": "I think you are right.", "exampleCn": "我认为你是对的。" },
  { "word": "make", "ipa": "/meɪk/", "pos": "verb", "meaning": "to create something by putting things together", "example": "She makes a cake.", "exampleCn": "她做一个蛋糕。" },
  { "word": "time", "ipa": "/taɪm/", "pos": "noun", "meaning": "something measured in minutes, hours, days, etc.", "example": "What time is it?", "exampleCn": "现在几点了？" },

    function loadProgressLocal() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return false;
            const data = JSON.parse(raw);
            if (data.progress) {
                Object.keys(data.progress).forEach(key => {
                    if (state.progress[key]) {
                        state.progress[key] = data.progress[key];
                    }
                });

            if (typeof data.part2Done === 'boolean') state.part2Done = data.part2Done;

        if (el) {
            el.textContent = message;
            el.className = 'cloud-status ' + type;
        }
    }

    async function saveProgressToCloud() {
        const saveBtn = document.getElementById('saveCloudBtn');
        try {
            saveBtn.disabled = true;
            saveBtn.textContent = '⏳ 保存中...';
            updateCloudStatus('⏳ 保存中...', 'loading');

            const cloudData = {
                version: '2.0',
                timestamp: new Date().toISOString(),
                progress: state.progress,
                part2Done: state.part2Done,
                part3Done: state.part3Done,
                part4Done: state.part4Done,
                currentPart: state.currentPart,
                cardIndex: state.cardIndex,
                totalWords: state.words.length,
            };

            const getResponse = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                headers: { 'Accept': 'application/vnd.github.v3+json' }
            });

            if (!getResponse.ok) {
                throw new Error(`获取Gist失败: ${getResponse.status}`);
            }

            const gistData = await getResponse.json();
            const fileSha = gistData.files[GIST_FILENAME]?.sha || null;

            const updateBody = {
                files: {
                    [GIST_FILENAME]: {
                        content: JSON.stringify(cloudData, null, 2)
                    }
                }
            };
            if (fileSha) {
                updateBody.files[GIST_FILENAME].sha = fileSha;
            }

            const patchResponse = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `token ${GIST_TOKEN}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify(updateBody)
            });

            if (!patchResponse.ok) {
                const errorData = await patchResponse.json();
                throw new Error(errorData.message || `HTTP ${patchResponse.status}`);
            }

            updateCloudStatus('✅ 已保存到云端', 'success');
            alert('✅ 进度已成功保存到云端！');
        } catch (error) {
            console.error('保存到云端失败:', error);
            updateCloudStatus('❌ 保存失败: ' + error.message, 'error');
            alert('❌ 保存到云端失败: ' + error.message);
        } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = '☁️ 保存到云端';
        }
    }

    async function loadProgressFromCloud() {
        const loadBtn = document.getElementById('loadCloudBtn');
        try {
            loadBtn.disabled = true;
            loadBtn.textContent = '⏳ 加载中...';
            updateCloudStatus('⏳ 加载中...', 'loading');

            const response = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                headers: { 'Accept': 'application/vnd.github.v3+json' }
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const gistData = await response.json();
            const fileContent = gistData.files[GIST_FILENAME]?.content;

            if (!fileContent) {
                throw new Error('云端未找到进度数据，请先保存');
            }

            const cloudData = JSON.parse(fileContent);

            if (cloudData.progress) {
                let mergedCount = 0;
                Object.keys(cloudData.progress).forEach(key => {
                    if (state.progress[key]) {
                        state.progress[key] = cloudData.progress[key];
                        mergedCount++;
                    }
                });
                console.log(`合并了 ${mergedCount} 个单词的进度`);
            }

            if (typeof cloudData.part2Done === 'boolean') state.part2Done = cloudData.part2Done;
            if (typeof cloudData.part3Done === 'boolean') state.part3Done = cloudData.part3Done;
            if (typeof cloudData.part4Done === 'boolean') state.part4Done = cloudData.part4Done;
            if (typeof cloudData.currentPart === 'number') state.currentPart = cloudData.currentPart;
            if (typeof cloudData.cardIndex === 'number') state.cardIndex = cloudData.cardIndex;

            generateQuizQuestions();
            renderAll();
            saveProgressLocal();

            updateCloudStatus('✅ 已从云端加载', 'success');
            alert('✅ 进度已从云端成功加载！');
        } catch (error) {
            console.error('从云端加载失败:', error);
            updateCloudStatus('❌ 加载失败: ' + error.message, 'error');
            alert('❌ 从云端加载失败: ' + error.message);
        } finally {
            loadBtn.disabled = false;
            loadBtn.textContent = '☁️ 从云端加载';
        }
    }

    // ================================================================
    // 核心功能
    // ================================================================
    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function getRandomMeanings(w, count) {
        const others = state.words.filter(x => x.word !== w.word || x.meaning !== w.meaning);
        const shuffled = shuffle(others);
        return shuffled.slice(0, count).map(x => x.meaning);
    }

    function generateQuizQuestions() {
        const words = state.words;
        const part = state.currentPart;
        let qs = [];
        if (part === 2) {
            qs = words.map(w => ({
                type: 'choice',
                word: w,
                question: w.word + ' ' + w.ipa,
                options: shuffle([w.meaning, ...getRandomMeanings(w, 3)]),
                answer: w.meaning,
            }));
        } else if (part === 3) {
            qs = words.map(w => ({
                type: 'input',
                word: w,
                question: w.meaning + ' ' + w.ipa,
                answer: w.word,
            }));
        } else if (part === 4) {
            qs = words.map(w => ({
                type: 'listen',
                word: w,
                question: '🔊 听音频，输入英文 (模拟男声) ' + w.ipa,
                answer: w.word,
            }));
        }
        if (part === 2) qs = qs.filter(q => !state.progress[getWordId(q.word)].part2);
        else if (part === 3) qs = qs.filter(q => !state.progress[getWordId(q.word)].part3);
        else if (part === 4) qs = qs.filter(q => !state.progress[getWordId(q.word)].part4);
        state.quizQuestions = qs;
        state.quizIndex = 0;
    }

    function renderAll() {
        renderCard();
        renderQuiz();
        renderProgress();
        renderWordlist();
    }

    function renderCard() {
        const words = state.words;
        if (!words.length) {
            document.getElementById('cardWord').textContent = '无词汇';
            document.getElementById('cardIndex').textContent = '0 / 0';
            return;
        }
        const idx = state.cardIndex % words.length;
        const w = words[idx];
        document.getElementById('cardWord').textContent = w.word;
        document.getElementById('cardIpa').textContent = w.ipa || '';
        document.getElementById('cardPos').textContent = w.pos || '';
        document.getElementById('cardPos').style.color = '#dc2626';
        document.getElementById('cardMeaning').textContent = w.meaning || '';
        document.getElementById('cardExample').innerHTML = '📌 ' + (w.example || '例句暂无') + '<br><span style="color:#475569;">' + (w.exampleCn || '') + '</span>';
        document.getElementById('cardExampleCn').textContent = '';
        document.getElementById('cardIndex').textContent = `${idx+1} / ${words.length}`;
        document.getElementById('playWordAudio').onclick = () => speak(w.word);
        document.getElementById('playExampleAudio').onclick = () => speak(w.example || w.word);
        saveProgressLocal();
    }

    // 修复音频功能 - 使用更可靠的语音合成
    function speak(text) {
        if (!text) return;
        // 取消任何正在进行的语音
        if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
        }
        
        try {
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'en-US';
            utter.rate = 0.85;
            utter.pitch = 1;
            utter.volume = 1;
            
            // 等待语音加载完成
            if (window.speechSynthesis.getVoices().length === 0) {
                window.speechSynthesis.onvoiceschanged = function() {
                    const voices = window.speechSynthesis.getVoices();
                    const male = voices.find(v => /male|man|en-US/i.test(v.name) && !/female|woman/i.test(v.name));
                    if (male) utter.voice = male;
                    window.speechSynthesis.speak(utter);
                    window.speechSynthesis.onvoiceschanged = null;
                };
                // 如果还是没有语音，直接尝试
                setTimeout(() => {
                    if (window.speechSynthesis.getVoices().length === 0) {
                        window.speechSynthesis.speak(utter);
                    }
                }, 100);
            } else {
                const voices = window.speechSynthesis.getVoices();
                const male = voices.find(v => /male|man|en-US/i.test(v.name) && !/female|woman/i.test(v.name));
                if (male) utter.voice = male;
                window.speechSynthesis.speak(utter);
            }
        } catch (e) {
            console.warn('语音合成失败:', e);
            // 降级方案：尝试不带语音选择的简单调用
            try {
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'en-US';
                window.speechSynthesis.speak(utter);
            } catch (e2) {
                console.error('语音合成完全失败:', e2);
            }
        }
    }

    function renderQuiz() {
        const part = state.currentPart;
        const label = document.getElementById('partLabel');
        if (part === 2) label.textContent = '第二部分 · 选中文';
        else if (part === 3) label.textContent = '第三部分 · 拼写英文';
        else if (part === 4) label.textContent = '第四部分 · 听写';

        const qs = state.quizQuestions;
        const container = document.getElementById('quizContent');
        if (!qs || qs.length === 0) {
            if (part === 2) { state.part2Done = true; tryUnlockNext(); }
            else if (part === 3) { state.part3Done = true; tryUnlockNext(); }
            else if (part === 4) { state.part4Done = true; }
            container.innerHTML = `<div style="padding:20px;text-align:center;background:#f0f9ff;border-radius:40px;">✅ 当前部分已完成！</div>`;
            document.getElementById('lockInfo').textContent = '🎉 所有题目完成！';
            saveProgressLocal();
            return;
        }
        const q = qs[state.quizIndex];
        if (!q) { container.innerHTML = '<div>加载题目失败</div>'; return; }

        let html = '';
        if (q.type === 'choice') {
            html = `<div style="font-weight:500;font-size:1.1rem;">${q.question}</div>
                    <div style="margin:12px 0;">选择正确的中文释义</div>`;
            q.options.forEach(opt => {
                html += `<div class="quiz-option" data-answer="${q.answer}" data-value="${opt}">${opt}</div>`;
            });
            html += `<div id="choiceFeedback" class="quiz-feedback"></div>`;
        } else if (q.type === 'input' || q.type === 'listen') {
            const label = q.type === 'input' ? '输入英文单词' : '听音频，输入英文单词';
            html = `<div style="font-weight:500;font-size:1.1rem;">${q.question}</div>
                    <div style="margin:8px 0;">${label}</div>
                    <input class="quiz-input" id="quizInput" placeholder="输入英文..." autofocus>
                    <button class="btn btn-primary" id="submitInput">提交</button>
                    <div id="inputFeedback" class="quiz-feedback"></div>`;
        }
        container.innerHTML = html;
        if (q.type === 'choice') {
            document.querySelectorAll('.quiz-option').forEach(el => {
                el.addEventListener('click', function() {
                    const val = this.dataset.value;
                    const answer = this.dataset.answer;
                    const fb = document.getElementById('choiceFeedback');
                    if (val === answer) {
                        this.classList.add('correct');
                        fb.textContent = '✅ 正确！';
                        const wid = getWordId(q.word);
                        if (part === 2) state.progress[wid].part2 = true;
                        else if (part === 3) state.progress[wid].part3 = true;
                        else if (part === 4) state.progress[wid].part4 = true;
                        saveProgressLocal();
                        setTimeout(() => { nextQuiz(); }, 400);
                    } else {
                        this.classList.add('wrong');
                        fb.textContent = '❌ 错误，请重试';
                        setTimeout(() => { this.classList.remove('wrong'); }, 500);
                    }
                });
            });
        } else {
            const input = document.getElementById('quizInput');
            if (input) setTimeout(() => input.focus(), 100);
            const btn = document.getElementById('submitInput');
            const fb = document.getElementById('inputFeedback');
            function checkInput() {
                const val = input.value.trim();
                if (val.toLowerCase() === q.answer.toLowerCase()) {
                    fb.textContent = '✅ 正确！';
                    const wid = getWordId(q.word);
                    if (part === 2) state.progress[wid].part2 = true;
                    else if (part === 3) state.progress[wid].part3 = true;
                    else if (part === 4) state.progress[wid].part4 = true;
                    saveProgressLocal();
                    setTimeout(() => { nextQuiz(); }, 400);
                } else {
                    fb.textContent = '❌ 错误，再试一次';
                    input.value = '';
                    input.focus();
                }
            }
            btn.addEventListener('click', checkInput);
            input.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkInput(); });
        }
        document.getElementById('lockInfo').textContent = `🔒 完成所有 ${qs.length} 题后解锁下一部分`;
    }

    function nextQuiz() {
        state.quizIndex++;
        if (state.quizIndex >= state.quizQuestions.length) {
            const part = state.currentPart;
            if (part === 2) state.part2Done = true;
            else if (part === 3) state.part3Done = true;
            else if (part === 4) state.part4Done = true;
            tryUnlockNext();
        }
        renderQuiz();
        renderProgress();
        renderWordlist();
        saveProgressLocal();
    }

    function tryUnlockNext() {
        const part = state.currentPart;
        if (part === 2 && state.part2Done) {
            state.currentPart = 3;
            generateQuizQuestions();
            renderQuiz();
        } else if (part === 3 && state.part3Done) {
            state.currentPart = 4;
            generateQuizQuestions();
            renderQuiz();
        }
        saveProgressLocal();
    }

    function renderProgress() {
        const words = state.words;
        let review=0, learning=0, mastered=0;
        words.forEach(w => {
            const p = state.progress[getWordId(w)];
            if (!p) return;
            const c = [p.part1, p.part2, p.part3, p.part4].filter(Boolean).length;
            if (c === 4) mastered++;
            else if (c > 0) learning++;
            else review++;
        });
        document.getElementById('reviewCount').textContent = review;
        document.getElementById('learningCount').textContent = learning;
        document.getElementById('masteredCount').textContent = mastered;
        document.getElementById('totalWordCount').textContent = `总词数: ${words.length}`;
    }

    function renderWordlist() {
        const tbody = document.getElementById('wordlistBody');
        const words = state.words;
        let html = '';
        words.forEach(w => {
            const p = state.progress[getWordId(w)];
            const c = p ? [p.part1, p.part2, p.part3, p.part4].filter(Boolean).length : 0;
            let statusText, statusClass;
            if (c === 4) { statusText = '已掌握'; statusClass = 'status-mastered'; }
            else if (c > 0) { statusText = '学习中'; statusClass = 'status-learning'; }
            else { statusText = '待复习'; statusClass = 'status-review'; }
            html += `<tr>
                <td><strong>${w.word}</strong></td>
                <td>${w.ipa || ''}</td>
                <td>${w.pos || ''}</td>
                <td>${w.meaning || ''}</td>
                <td><span class="status-badge ${statusClass}">${statusText}</span></td>
            </tr>`;
        });
        tbody.innerHTML = html || '<tr><td colspan="5">暂无词汇</td></tr>';
        document.getElementById('wordlistMeta').textContent = `共 ${words.length} 个单词`;
    }

    // ================================================================
    // 事件绑定
    // ================================================================
    document.getElementById('prevCardBtn').addEventListener('click', function() {
        if (state.words.length) { state.cardIndex = (state.cardIndex - 1 + state.words.length) % state.words.length; renderCard(); }
    });
    document.getElementById('nextCardBtn').addEventListener('click', function() {
        if (state.words.length) { state.cardIndex = (state.cardIndex + 1) % state.words.length; renderCard(); }
    });

    document.getElementById('shuffleBtn').addEventListener('click', function() {
        state.words = shuffle(state.words);
        state.cardIndex = 0;
        generateQuizQuestions();
        renderAll();
        saveProgressLocal();
    });

    document.getElementById('resetAllBtn').addEventListener('click', function() {
        if (!confirm('确定要重置全部学习进度吗？此操作不可撤销！')) return;
        state.words.forEach(w => {
            const id = getWordId(w);
            state.progress[id] = { part1: false, part2: false, part3: false, part4: false };
        });
        state.part2Done = false; state.part3Done = false; state.part4Done = false;
        state.currentPart = 2;
        state.cardIndex = 0;
        generateQuizQuestions();
        renderAll();
        saveProgressLocal();
        alert('已重置全部进度');
    });

    document.getElementById('resetQuizBtn').addEventListener('click', function() {
        generateQuizQuestions();
        renderQuiz();
        saveProgressLocal();
    });

    document.getElementById('saveCloudBtn').addEventListener('click', saveProgressToCloud);
    document.getElementById('loadCloudBtn').addEventListener('click', loadProgressFromCloud);

    // ================================================================
    // 初始化
    // ================================================================
    // 预加载语音
    if (window.speechSynthesis) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = function() {
            window.speechSynthesis.getVoices();
        };
    }

    // 加载本地进度
    loadProgressLocal();

    // 生成题目
    generateQuizQuestions();

    // 渲染
    renderAll();

    console.log('📚 NGSL 1-400 复习工具已启动');
    console.log(`📝 共 ${state.words.length} 个单词`);
    console.log('☁️ 点击「保存到云端」可备份进度，点击「从云端加载」可恢复进度');
</script>
</body>
</html>
